name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Public, client-side values for the /start/ funnel — none of these is a secret, they all
          # ship in the bundle. They live in repo secrets only so they are set in one place.
          # Any of them missing = the paywall renders visibly disabled instead of sending a buyer
          # to a dead checkout. See isCheckoutConfigured() in src/config/funnel.ts.
          # One hosted checkout per funnel: a RevenueCat project can only sell its own app, so
          # Sofia's URL cannot take money for Emily. The unsuffixed one is the fallback.
          PUBLIC_RC_WEB_BILLING_URL: ${{ secrets.PUBLIC_RC_WEB_BILLING_URL }}
          PUBLIC_RC_WEB_BILLING_URL_BLISS: ${{ secrets.PUBLIC_RC_WEB_BILLING_URL_BLISS }}
          PUBLIC_RC_WEB_BILLING_URL_SOFIA: ${{ secrets.PUBLIC_RC_WEB_BILLING_URL_SOFIA }}
          PUBLIC_RC_WEB_BILLING_URL_EMILY: ${{ secrets.PUBLIC_RC_WEB_BILLING_URL_EMILY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          # Ad pixels, funnel pages only. Unset = no tracker is emitted at all.
          PUBLIC_META_PIXEL_ID: ${{ secrets.PUBLIC_META_PIXEL_ID }}
          PUBLIC_TIKTOK_PIXEL_ID: ${{ secrets.PUBLIC_TIKTOK_PIXEL_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
