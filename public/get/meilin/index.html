    <title>Meilin — AI Chinese Tutor</title>
    <!--
      Redirection bio Instagram → App Store. Les liens apps.apple.com directs se font flagger
      par le filtre spam d'IG ; un chemin sur NOTRE domaine passe, et l'utilisateur ne voit

      recours). Même motif à répliquer pour les autres apps : public/get/<app>/index.html.
    -->
    <meta http-equiv="refresh" content="0;url=https://apps.apple.com/app/id6806812871" />
    <script>window.location.replace("https://apps.apple.com/app/id6806812871");</script>
    <style>body{font-family:-apple-system,system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#fff;color:#111;margin:0}</style>

  </body>
